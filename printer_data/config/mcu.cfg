#------------------------------------------#
#### CUSTOM TEMPLATE MCU definition ########
#------------------------------------------#

# This template file is a pre-filled file with Klippain pins alias conventions
# that can be used if your MCU board is not yet officially supported. Just fill
# in your MCU pins and you will be good to go :)

[mcu]
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_2E003E000451323336333538-if00
# canbus_uuid: change-me-to-the-correct-canbus-id
##--------------------------------------------------------------------

[include config/mcu_definitions/main/Mellow_Fly_Super8_v1.x.cfg] # Do not remove this line
[board_pins fly_Super8_mcu]
mcu: mcu
aliases:
    X_STEP=MCU_DRIVE4_STEP   , X_DIR=MCU_DRIVE4_DIR   , X_ENABLE=MCU_DRIVE4_EN   , X_TMCUART=MCU_DRIVE4_UART   ,
    Y_STEP=MCU_DRIVE6_STEP   , Y_DIR=MCU_DRIVE6_DIR   , Y_ENABLE=MCU_DRIVE6_EN   , Y_TMCUART=MCU_DRIVE6_UART   ,
    X1_STEP=MCU_DRIVE3_STEP   , X1_DIR=MCU_DRIVE3_DIR   , X1_ENABLE=MCU_DRIVE3_EN   , X1_TMCUART=MCU_DRIVE3_UART   ,
    Y1_STEP=MCU_DRIVE5_STEP   , Y1_DIR=MCU_DRIVE5_DIR   , Y1_ENABLE=MCU_DRIVE5_EN   , Y1_TMCUART=MCU_DRIVE5_UART   ,
    Z_STEP=MCU_DRIVE0_STEP   , Z_DIR=MCU_DRIVE0_DIR   , Z_ENABLE=MCU_DRIVE0_EN   , Z_TMCUART=MCU_DRIVE0_UART   ,
#Z1_STEP=MCU_DRIVE4_STEP  , Z1_DIR=MCU_DRIVE4_DIR  , Z1_ENABLE=MCU_DRIVE4_EN  , Z1_TMCUART=MCU_DRIVE4_UART  ,
#Z2_STEP=MCU_DRIVE5_STEP  , Z2_DIR=MCU_DRIVE5_DIR  , Z2_ENABLE=MCU_DRIVE5_EN  , Z2_TMCUART=MCU_DRIVE5_UART  ,
    #Z3_STEP=MCU_DRIVE6_STEP  , Z3_DIR=MCU_DRIVE6_DIR  , Z3_ENABLE=MCU_DRIVE6_EN  , Z3_TMCUART=MCU_DRIVE6_UART  ,

    #E_STEP=MCU_DRIVE2_STEP   , E_DIR=MCU_DRIVE2_DIR   , E_ENABLE=MCU_DRIVE2_EN   , E_TMCUART=MCU_DRIVE2_UART   ,

    DRIVER_SPI_MOSI=MCU_TMC_MOSI , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_MISO=MCU_TMC_MISO , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_SCK=MCU_TMC_SCK  , # Used in case of SPI drivers such as TMC2240 or TMC5160

    #X_STOP=MCU_IO0 , 
    Y_STOP=MCU_IO1 , # Z_STOP=MCU_IO3 ,
    # PROBE_INPUT=MCU_HV_IN  ,
    RUNOUT_SENSOR=MCU_IO1 ,

    E_HEATER=MCU_HEAT0   , E_TEMPERATURE=MCU_ADC_0   ,
    BED_HEATER=MCU_BED   , BED_TEMPERATURE=MCU_ADC_5 ,

    PART_FAN=MCU_IN7 , # E_FAN=MCU_FAN1 ,
    CONTROLLER_FAN=MCU_FAN2        ,
    EXHAUST_FAN=MCU_FAN3           ,
    FILTER_FAN=MCU_FAN4            ,
    HOST_CONTROLLER_FAN=MCU_FAN5   ,

    CHAMBER_TEMPERATURE=MCU_ADC_1 ,
    ELECTRICAL_CABINET_TEMPERATURE=MCU_ADC_2 ,

    LIGHT_OUTPUT=MCU_HEAT1    ,
#    LIGHT_NEOPIXEL=  ,
#    STATUS_NEOPIXEL= ,

    SERVO_PIN=MCU_SERVO ,


#--------------------------------------------#
#### Mellow SHT36 v3.x MCU definition ########
#--------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
canbus_uuid: change-me-to-the-correct-canbus-id
##--------------------------------------------------------------------

# If you want to override the wiring of the Mellow SHT, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include config/mcu_definitions/toolhead/Mellow_SHT36_v3.x.cfg] # Do not remove this line
[board_pins sht_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_EXT_STEP , E_DIR=MCU_EXT_DIR , E_ENABLE=MCU_EXT_EN , E_TMCUART=MCU_EXT_UART ,

    X_STOP=MCU_LIMIT_0 , Y_STOP=MCU_LIMIT_1 ,
    PROBE_INPUT=MCU_PROBE_1   ,
    TOOLHEAD_SENSOR=MCU_PROBE_2 ,

    E_HEATER=MCU_HE0 , E_TEMPERATURE=MCU_TH0 ,

    PART_FAN=MCU_FAN0 , E_FAN=MCU_FAN1 ,

    STATUS_NEOPIXEL=MCU_RGBLED ,

    LIS2DW=MCU_LIS2DW_CS ,
    SCK=MCU_SW_SCK , MISO=MCU_SW_MISO , MOSI=MCU_SW_MOSI ,


#----------------------------------------#
#    Mellow SHT36 v3.x pins remapping    #
#----------------------------------------#

# These pins overrides are automatically added when you select a CANbus
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
sensor_pin: toolhead:E_TEMPERATURE

[probe]
pin: ^toolhead:PROBE_INPUT

[fan]
pin: toolhead:PART_FAN

[heater_fan hotend_fan]
pin: toolhead:E_FAN

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to the toolhead MCU
# [stepper_x]
# endstop_pin: ^toolhead:X_STOP

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART

